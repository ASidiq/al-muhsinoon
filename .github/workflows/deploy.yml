name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  schedule:
    # The Upcoming page's countdown poster is chosen at build time, so a site that
    # isn't rebuilt goes stale. Rebuild daily through the run-up to an event.
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PROJECT_NAME: almuhsinoon
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"

          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$API/$PROJECT_NAME")

          if [ "$status" = "200" ]; then
            echo "Pages project '$PROJECT_NAME' already exists."
          else
            echo "Pages project '$PROJECT_NAME' not found (HTTP $status) — creating it."
            response=$(curl -s -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"name\":\"$PROJECT_NAME\",\"production_branch\":\"main\"}" \
              "$API")
            ok=$(echo "$response" | jq -r '.success')
            if [ "$ok" != "true" ]; then
              echo "$response"
              echo "Failed to create Pages project"
              exit 1
            fi
            echo "Created Pages project '$PROJECT_NAME'."
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.PROJECT_NAME }}
